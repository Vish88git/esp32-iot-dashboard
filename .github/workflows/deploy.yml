name: Deploy to Minikube

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Verify kubectl
        run: kubectl version --client

      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/mosquitto --timeout=60s
          kubectl rollout status deployment/influxdb --timeout=60s
          kubectl rollout status deployment/nodered --timeout=60s
          kubectl rollout status deployment/grafana --timeout=60s

      - name: Show pod status
        run: kubectl get pods
